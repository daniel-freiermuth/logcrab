name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ubuntu-package:
    name: Build Ubuntu 24.04 release artifacts
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install release build dependencies
        run: sudo apt-get update && sudo apt-get install --yes dpkg-dev protobuf-compiler

      - uses: taiki-e/install-action@cargo-deb

      - name: Build release binaries
        run: cargo build --release --locked --bins

      - name: Build Debian package
        run: cargo deb --locked

      - name: Assemble release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          tar -C target/release -czf "dist/logcrab_${VERSION}_amd64_ubuntu24.tar.gz" logcrab logcrab-export logcrab-mcp
          cp target/debian/*.deb dist/
          cp PKGBUILD dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
