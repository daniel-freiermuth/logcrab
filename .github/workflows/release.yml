name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  ubuntu-package:
    name: Build Ubuntu 24.04 release artifacts
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable

      - id: version
        name: Detect package version change
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          current="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "logcrab").version')"
          previous="$(git show "$BEFORE:Cargo.toml" 2>/dev/null | awk -F'"' '/^version = / { print $2; exit }')"
          tag="v${current}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$previous" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::Release tag ${tag} already exists"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.release == 'true'
        uses: Swatinem/rust-cache@v2

      - if: steps.version.outputs.release == 'true'
        name: Install release build dependencies
        run: sudo apt-get update && sudo apt-get install --yes dpkg-dev protobuf-compiler

      - if: steps.version.outputs.release == 'true'
        uses: taiki-e/install-action@cargo-deb

      - if: steps.version.outputs.release == 'true'
        name: Build release binaries
        run: cargo build --release --locked --bins

      - if: steps.version.outputs.release == 'true'
        name: Build Debian package
        run: cargo deb --locked

      - if: steps.version.outputs.release == 'true'
        name: Assemble release artifacts
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dist
          tar -C target/release -czf "dist/logcrab_${VERSION}_amd64_ubuntu24.tar.gz" logcrab logcrab-export logcrab-mcp
          cp target/debian/*.deb dist/
          cp PKGBUILD dist/

      - if: steps.version.outputs.release == 'true'
        name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
